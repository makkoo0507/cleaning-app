<style>
  :root {

<div class="page">
  <p class="eyebrow">民泊清掃管理システム</p>
  <h1>連携している外部サービスと通信の向き</h1>
  <p class="lede">
    「プロバイダー」はLINE Developersコンソール上のチャネル（Messaging API・LINEログイン）に紐づく概念。
    この2つのチャネルを<strong style="color:var(--ink)">同一プロバイダー</strong>内に作成する必要がある
    （別プロバイダーだとuserIdが一致せず通知が届かない）。
  </p>

    <figcaption>
      外側の緑枠は「業者が保有するLINEアカウント」。LINE公式アカウント自体にプロバイダーという概念はなく、
      プロバイダーはLINE DevelopersコンソールでMessaging APIチャネル・LINEログインチャネルを作成する際に紐づく概念。
      この2つのチャネル（青い破線枠内）を同一プロバイダー内に作成しないと、userIdが一致せず通知が届かない（400エラー）。
      LINE公式アカウントでMessaging APIを有効化するとそのチャネルが作られ、LINEログインは別チャネルとして本人確認だけを担う。
      両方ともVercel上の単一Next.jsアプリ（フロント・バックエンド同居）と直接通信し、アプリはSupabase（DB・Auth・Storage）へ都度読み書きする。
    </figcaption>
