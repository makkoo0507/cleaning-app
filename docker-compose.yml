services:
  app:
    build:
      context: ./next
      dockerfile: ../docker/Dockerfile.dev
    ports:
      - "3000:3000"
    volumes:
      - ./next:/app                    # ソースコードをホストからバインドマウント
      - /app/node_modules              # node_modulesはコンテナ内の匿名ボリューム（ホストとの遅いI/Oを回避）
      - /app/.next                     # Turbopackキャッシュも同様にコンテナ内の匿名ボリューム
    env_file:
      - .env.local
    environment:
      - WATCHPACK_POLLING=true         # Mac でのホットリロード対応
      - SUPABASE_URL=http://host.docker.internal:54321  # コンテナ→ホストの Supabase
